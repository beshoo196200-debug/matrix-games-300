<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Games | عالم ماتريكس للألعاب</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: radial-gradient(circle at top, #060c06 0%, #010301 100%); 
            color: #fff; margin: 0; padding: 0; text-align: center; min-height: 100vh;
        }
        .top-header {
            display: flex; justify-content: space-between; align-items: center;
            background: #060c06; padding: 15px 30px; border-bottom: 2px solid #00ff66;
            box-sizing: border-box; box-shadow: 0 4px 20px rgba(0,255,102,0.15);
        }
        .logo-title { font-size: 26px; font-weight: 900; color: #00ff66; text-shadow: 0 0 15px rgba(0,255,102,0.6); }
        .header-actions { display: flex; align-items: center; gap: 15px; }
        .search-box { 
            padding: 11px 22px; border-radius: 20px; border: 1px solid #142414;
            background: #142414; color: #fff; font-size: 14px; outline: none; text-align: center; width: 220px;
        }
        .search-box:focus { border-color: #00ff66; }
        .auth-trigger-btn, .admin-trigger-btn {
            background: #00ff66; color: #010301; border: none; padding: 10px 22px;
            border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.3s;
        }
        .admin-trigger-btn { background: #ffffff; color: #060c06; display: none; }
        .user-badge { color: #00ff66; font-weight: bold; font-size: 14px; display: none; }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(1, 3, 1, 0.9); z-index: 99999; display: none;
            align-items: center; justify-content: center;
        }
        .auth-box {
            background: #0c1a0c; border: 2px solid #00ff66; padding: 35px;
            border-radius: 20px; box-shadow: 0 0 30px rgba(0,255,102,0.3); width: 90%; max-width: 390px; position: relative;
        }
        .close-modal { position: absolute; top: 15px; left: 15px; color: #fff; font-size: 22px; cursor: pointer; }
        .auth-input {
            width: 100%; padding: 13px; margin: 12px 0; border-radius: 8px;
            border: 1px solid #142414; background: #060c06; color: #fff; text-align: center; box-sizing: border-box;
        }
        .auth-btn {
            width: 100%; padding: 13px; background: #00ff66; color: #000;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 12px;
        }
        #admin-panel {
            background: #0c1a0c; border: 2px solid #ffffff; padding: 25px; margin: 25px auto;
            border-radius: 20px; max-width: 520px; display: none; text-align: right;
        }
        .main-container { padding: 40px 25px; }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 25px; max-width: 1250px; margin: 0 auto; }
        .game-card { background: #060c06; border: 1px solid #142414; padding: 12px; border-radius: 16px; cursor: pointer; transition: 0.3s; }
        .game-card:hover { border-color: #00ff66; transform: translateY(-6px); box-shadow: 0 12px 24px rgba(0,255,102,0.25); }
        .game-thumb { width: 100%; height: 115px; object-fit: cover; border-radius: 12px; background: #142414; }
        .game-title { font-size: 14px; font-weight: bold; margin-top: 12px; color: #e2e8f0; text-transform: capitalize; }
        #game-screen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; }
        .control-bar { display: flex; justify-content: space-between; align-items: center; background: #060c06; padding: 10px 25px; border-bottom: 2px solid #00ff66; height: 65px; box-sizing: border-box; }
        .btn { padding: 12px 25px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .back-btn { background: #f43f5e; color: #fff; }
        .full-btn { background: #00ff66; color: #010301; }
        .iframe-container { width: 100%; height: calc(100vh - 65px); background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="top-header">
        <div class="logo-title">MATRIX GAMES</div>
        <div class="header-actions">
            <input type="text" id="search-input" class="search-box" placeholder="🔍 ابحث عن ألعاب ماتريكس..." onkeyup="filterGames()">
            <button id="admin-panel-btn" class="admin-trigger-btn" onclick="toggleAdminPanelVisibility()">لوحة الأدمن ⚙️</button>
            <button id="auth-btn-trigger" class="auth-trigger-btn" onclick="openAuthModal()">تسجيل الدخول 🎮</button>
            <div id="user-display" class="user-badge"></div>
        </div>
    </div>

    <div id="admin-panel">
        <h3 style="color: #00ff66; margin-top: 0; text-align: center;">⚙️ لوحة تحكم مدير منصة ماتريكس</h3>
        <label>اسم اللعبة الجديدة:</label>
        <input type="text" id="new-game-name" class="auth-input" placeholder="مثال: level-devil">
        <button class="auth-btn" onclick="addNewGameFromPanel()">إضافة اللعبة 🚀</button>
    </div>

    <div class="main-container">
        <div class="games-grid" id="main-grid"></div>
    </div>

    <div id="game-screen">
        <div class="control-bar">
            <button class="btn back-btn" onclick="closeGame()">◄ خروج ورجوع</button>
            <h2 id="current-title" style="margin: 0; font-size: 18px; color: #00ff66;">اسم اللعبة</h2>
            <button class="btn full-btn" onclick="goFull()">ملء الشاشة ⛶</button>
        </div>
        <div class="iframe-container" id="player-box">
            <iframe id="game-container" src="" allowfullscreen></iframe>
        </div>
    </div>

    <div id="auth-modal" class="modal-overlay" onclick="closeAuthModal(event)">
        <div class="auth-box" onclick="event.stopPropagation()">
            <span class="close-modal" onclick="document.getElementById('auth-modal').style.display='none'">✕</span>
            <div id="login-panel">
                <h3 style="color: #00ff66; margin-top: 0;">تسجيل دخول عالم ماتريكس</h3>
                <input type="text" id="login-user" class="auth-input" placeholder="اسم الحساب">
                <input type="password" id="login-pass" class="auth-input" placeholder="كلمة المرور">
                <button class="auth-btn" onclick="loginPlayer()">دخول السيرفر</button>
                <span class="toggle-link" onclick="togglePanel(false)">لا تملك حساباً? إنشاء حساب لاعب جديد</span>
            </div>
            <div id="register-panel" style="display: none;">
                <h3 style="color: #00ff66; margin-top: 0;">إنشاء حساب لاعب جديد</h3>
                <input type="text" id="reg-user" class="auth-input" placeholder="اسم مستخدم جديد">
                <input type="password" id="reg-pass" class="auth-input" placeholder="كلمة مرور قوية">
                <button class="auth-btn" onclick="registerPlayer()">تأكيد الحساب</button>
            </div>
        </div>
    </div>
